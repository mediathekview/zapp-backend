name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Use latest Node.js
      uses: actions/setup-node@v6
      with:
        node-version: latest

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test
